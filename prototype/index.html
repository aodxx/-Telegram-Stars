<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Stars Membership — UI Prototype</title>
<style>
body{margin:0;background:#0e1621;color:#eef3f6;font:16px system-ui,sans-serif}
.phone{max-width:390px;min-height:760px;margin:20px auto;background:#17212b;border-radius:24px;overflow:hidden;box-shadow:0 8px 30px #0008}
.top{padding:18px 18px 10px;background:#202b36;font-weight:700}
.screen{padding:18px}
.card{background:#202b36;border-radius:18px;padding:18px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 8px} h2{font-size:19px;margin:0 0 12px}
.muted{color:#aeb9c4}.price{font-size:30px;font-weight:800;margin:10px 0 18px}
button{width:100%;border:0;border-radius:13px;padding:13px 12px;margin:5px 0;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:#e8b84a;color:#15191d}.secondary{background:#2a3947;color:#eef3f6}
.status{font-weight:800}.active{color:#55d187}
ul{padding-left:20px;line-height:1.8}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div class="phone">
<div class="top">Telegram Stars Membership · Prototype v0.2</div>
<div class="screen">
<div class="card">
<h1>🎬 MEMBERSHIP</h1>
<div class="muted">ระบบสมาชิกแบบรายเดือน</div>
</div>
<div class="card">
<h2>สถานะสมาชิก</h2>
<div class="status">⚪ ยังไม่ได้เป็นสมาชิก</div>
</div>
<div class="card">
<h2>⭐ สมาชิก 30 วัน</h2>
<div class="price">XXX Stars</div>
<ul>
<li>เข้ากลุ่มสมาชิก</li>
<li>ใช้งาน 30 วัน</li>
<li>แจ้งเตือนก่อนหมดอายุ</li>
<li>ต่ออายุได้</li>
</ul>
<button class="primary">⭐ สมัครสมาชิก</button>
</div>
<div class="nav">
<button class="secondary">ℹ️ รายละเอียด</button>
<button class="secondary">❓ วิธีใช้งาน</button>
</div>
</div>
</div>
</body>
</html>
